<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShelfCheck device preview</title><style>body{margin:0;padding:16px;background:#e4e8df;font:14px system-ui;color:#233b30}h1{font-size:20px}h2{font-size:14px;margin:16px 0 8px}.phones{display:flex;gap:14px;align-items:start}iframe{border:1px solid #bbc6b2;background:white;border-radius:8px;display:block;flex-shrink:0}.wide{transform-origin:top left}.stage{overflow:hidden;margin-bottom:20px}</style></head><body><h1>ShelfCheck · Responsive layouts</h1><label>Screen <select id="screen"><option value="home">Overview</option><option value="shelf">My shelf</option><option value="check">Comparison</option><option value="scan">Skin insights</option><option value="saved">Saved decisions</option></select></label><pre id="report" style="white-space:pre-wrap;font-size:12px"></pre><div class="phones"><section><h2>Small phone · 320 px</h2><iframe title="320 pixel preview" src="/" width="320" height="1600"></iframe></section><section><h2>Phone · 375 px</h2><iframe title="375 pixel preview" src="/" width="375" height="1600"></iframe></section></div><h2>Tablet · 768 px</h2><div class="stage" style="height:1080px"><iframe class="wide" title="768 pixel preview" src="/" width="768" height="1200" style="transform:scale(.9)"></iframe></div><h2>Small laptop · 1024 px</h2><div class="stage" style="height:910px"><iframe class="wide" title="1024 pixel preview" src="/" width="1024" height="1350" style="transform:scale(.67)"></iframe></div><h2>Desktop · 1440 px</h2><div class="stage" style="height:510px"><iframe class="wide" title="1440 pixel preview" src="/" width="1440" height="1050" style="transform:scale(.48)"></iframe></div><script>function report(){document.querySelector('#report').textContent=Array.from(document.querySelectorAll('iframe')).map(f=>{const d=f.contentDocument;if(!d?.querySelector('main'))return f.width+': loading';const root=d.documentElement;return f.width+'px: document '+root.clientWidth+'px / content '+root.scrollWidth+'px — '+(root.scrollWidth<=root.clientWidth?'PASS':'OVERFLOW');}).join('\n');}document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',report));window.addEventListener('load',report);document.querySelector('#screen').onchange=e=>{document.querySelectorAll('iframe').forEach(f=>f.contentDocument.querySelector('[data-page="'+e.target.value+'"]').click());report();};</script></body></html>
